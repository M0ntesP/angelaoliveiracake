<body data-page="feedback">
  <div id="site-header"></div>
  <main id="main-content" class="container section" tabindex="-1">
    <header class="feedback-intro">
      <h1>Histórias feitas para celebrar.</h1>
      <p class="intro">Veja registros de bolos e celebrações de quem já encomendou com a Ângela.</p>
    </header>

    <section class="feedback-layout feedback-layout-single" aria-label="Fotos de clientes">
      <!--
        Depoimentos escritos: publique aqui apenas comentários reais, com autorização do cliente.
        Modelo:
        <div>
          <h2 class="feedback-column-title">O que os clientes contam</h2>
          <div class="feedback-reviews">
            <figure class="review-card">
              <blockquote>Texto enviado pelo cliente.</blockquote>
              <figcaption>Nome autorizado pelo cliente</figcaption>
            </figure>
          </div>
        </div>
        Ao voltar a usar duas colunas, remova a classe "feedback-layout-single" abaixo.
      -->
      <div>
        <h2 class="feedback-column-title">Fotos de encomendas e celebrações</h2>
        <div class="feedback-photos">
          <figure class="feedback-photo-card">
            <a class="feedback-photo-link" href="/images/feedback/bolo-azul-primeiro-aniversario.jpg" target="_blank" rel="noopener" aria-label="Abrir foto do bolo azul de primeiro aniversário em tamanho original">
              <span class="photo-frame" style="--photo-backdrop: url('/images/optimized/feedback/bolo-azul-primeiro-aniversario-480.webp')"><span class="photo-frame-backdrop" aria-hidden="true"></span><img class="photo-frame-image" src="/images/feedback/bolo-azul-primeiro-aniversario.jpg" srcset="/images/optimized/feedback/bolo-azul-primeiro-aniversario-480.webp 480w, /images/optimized/feedback/bolo-azul-primeiro-aniversario-517.webp 517w" sizes="(max-width: 850px) calc((100vw - 52px) / 2), 270px" data-fallback-src="/images/feedback/bolo-azul-primeiro-aniversario.jpg" width="517" height="529" alt="Bolo azul de aniversário de 1 ano com tema Poderoso Chefinho" loading="eager" decoding="async"></span>
            </a>
            <figcaption>Bolo temático do primeiro aniversário</figcaption>
          </figure>
          <figure class="feedback-photo-card">
            <a class="feedback-photo-link" href="/images/feedback/familia-bolo-infantil-azul.jpg" target="_blank" rel="noopener" aria-label="Abrir foto da comemoração em família em tamanho original">
              <span class="photo-frame" style="--photo-backdrop: url('/images/optimized/feedback/familia-bolo-infantil-azul-480.webp')"><span class="photo-frame-backdrop" aria-hidden="true"></span><img class="photo-frame-image" src="/images/feedback/familia-bolo-infantil-azul.jpg" srcset="/images/optimized/feedback/familia-bolo-infantil-azul-480.webp 480w, /images/optimized/feedback/familia-bolo-infantil-azul-960.webp 960w" sizes="(max-width: 850px) calc((100vw - 52px) / 2), 270px" data-fallback-src="/images/feedback/familia-bolo-infantil-azul.jpg" width="1060" height="1200" alt="Família reunida ao lado de bolo infantil azul em uma comemoração" loading="lazy" decoding="async"></span>
            </a>
            <figcaption>Uma comemoração em família</figcaption>
          </figure>
          <figure class="feedback-photo-card">
            <a class="feedback-photo-link" href="/images/feedback/bolo-festa-15-anos.jpg" target="_blank" rel="noopener" aria-label="Abrir foto do bolo de 15 anos em tamanho original">
              <span class="photo-frame" style="--photo-backdrop: url('/images/optimized/feedback/bolo-festa-15-anos-480.webp')"><span class="photo-frame-backdrop" aria-hidden="true"></span><img class="photo-frame-image" src="/images/feedback/bolo-festa-15-anos.jpg" srcset="/images/optimized/feedback/bolo-festa-15-anos-480.webp 480w, /images/optimized/feedback/bolo-festa-15-anos-960.webp 960w" sizes="(max-width: 850px) calc((100vw - 52px) / 2), 270px" data-fallback-src="/images/feedback/bolo-festa-15-anos.jpg" width="1200" height="1600" alt="Jovem comemora 15 anos diante de uma mesa com bolo decorado em tons de azul" loading="lazy" decoding="async"></span>
            </a>
            <figcaption>Uma festa de 15 anos em azul e dourado</figcaption>
          </figure>
          <figure class="feedback-photo-card">
            <a class="feedback-photo-link" href="/images/feedback/familia-bolo-comemoracao-rosa.jpg" target="_blank" rel="noopener" aria-label="Abrir foto da família na comemoração com bolo rosa em tamanho original">
              <span class="photo-frame" style="--photo-backdrop: url('/images/optimized/feedback/familia-bolo-comemoracao-rosa-480.webp')"><span class="photo-frame-backdrop" aria-hidden="true"></span><img class="photo-frame-image" src="/images/feedback/familia-bolo-comemoracao-rosa.jpg" srcset="/images/optimized/feedback/familia-bolo-comemoracao-rosa-480.webp 480w, /images/optimized/feedback/familia-bolo-comemoracao-rosa-960.webp 960w" sizes="(max-width: 850px) calc((100vw - 52px) / 2), 270px" data-fallback-src="/images/feedback/familia-bolo-comemoracao-rosa.jpg" width="1200" height="1600" alt="Família reunida ao lado de um bolo de aniversário decorado em rosa" loading="lazy" decoding="async"></span>
            </a>
            <figcaption>Um aniversário para guardar na memória</figcaption>
          </figure>

        <h2 id="feedback-invite-title">Já encomendou com a Ângela?</h2>

      </div>
      <a class="button button-light" href="https://wa.me/5511984383266?text=Ol%C3%A1%2C%20%C3%82ngela%21%20Vim%20pelo%20site%20e%20quero%20contar%20como%20foi%20a%20minha%20encomenda.">Enviar meu feedback</a>
    </section>
